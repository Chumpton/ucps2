<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Viewer Widget</title>
    <link rel="stylesheet" crossorigin href="./dist-widget/auraviewer.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            /* Lock scroll inside the widget */
        }

        #auraviewer-root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="auraviewer-root"></div>
    <script type="module" crossorigin src="./dist-widget/auraviewer.js"></script>
</body>

</html>
